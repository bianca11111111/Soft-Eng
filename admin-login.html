<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="LOGO.png">
    <title>CCS Archive - Admin Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="login-container">
    <div class="login-card">
        <div class="logo-box">
            <img src="LOGO.png" alt="CCS Logo">
            <h1>CCS ARCHIVE</h1>
        </div>

        <div class="input-field">
            <label>Email Address/Admin ID</label>
            <input type="text" placeholder="Username" autocomplete="username">
        </div>

        <div class="input-field">
            <label>Enter your password</label>
            <input type="password" placeholder="Password" autocomplete="current-password">
        </div>

        <button class="login-btn">Log in</button>
        <p style="margin:8px 0 0;font-size:.85rem;color:#6b4f2a;">Use your administrator credentials.</p>
        <a href="#" class="forgot-link">Forgot Password?</a>
    </div>
</div>

<script src="SE.js"></script>
</body>
</html>
